<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practical Files Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #24292f;
            color: white;
            padding: 22px 25px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .category {
            background: white;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #ddd;
        }

        .category-title {
            padding: 18px 20px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            background: #ffffff;
            user-select: none;
        }

        .category-title:hover {
            background: #f0f2f4;
        }

        .arrow {
            display: inline-block;
            width: 25px;
            transition: transform 0.2s;
        }

        .category.open .arrow {
            transform: rotate(90deg);
        }

        .practicals {
            display: none;
            border-top: 1px solid #ddd;
            padding: 10px;
            background: #fafafa;
        }

        .category.open .practicals {
            display: block;
        }

        .practical {
            background: white;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
            overflow: hidden;
        }

        .practical-title {
            padding: 14px 16px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        .practical-title:hover {
            background: #f0f2f4;
        }

        .practical-content {
            display: none;
            padding: 18px;
            border-top: 1px solid #ddd;
        }

        .practical.open .practical-content {
            display: block;
        }

        .aim {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        pre {
            background: #111827;
            color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
            font-family: Consolas, "Courier New", monospace;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
            color: #555;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ffb3b3;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    📁 Practical Files Viewer
</header>

<div class="container">

    <div id="loading" class="loading">
        Loading practicals...
    </div>

    <div id="viewer"></div>

</div>

<footer>
    Practical Files Viewer
</footer>


<script>

    /*
        Your GitHub repository contains these three files:

        MAJOR
        ETHICAL
        STQA

        This page reads those files and automatically
        creates the practical list.
    */

    const categories = [
        {
            name: "MAJOR",
            file: "MAJOR"
        },
        {
            name: "ETHICAL",
            file: "ETHICAL"
        },
        {
            name: "STQA",
            file: "STQA"
        }
    ];


    // --------------------------------------------------
    // Load a practical file
    // --------------------------------------------------

    async function loadFile(fileName) {

        const response = await fetch("./" + fileName);

        if (!response.ok) {
            throw new Error(
                "Could not load file: " + fileName +
                " (HTTP " + response.status + ")"
            );
        }

        return await response.text();
    }


    // --------------------------------------------------
    // Parse practicals
    // --------------------------------------------------

    function parsePracticals(text) {

        /*
            Your files use headings such as:

            P1.Aim: To study...
            P2.Aim: To implement...
            P3.Aim: ...

            This detects every P<number>.Aim:
        */

        const pattern = /(?:^|\n)\s*(P\d+)\s*\.\s*Aim\s*:/gi;

        const matches = [...text.matchAll(pattern)];

        const practicals = [];

        for (let i = 0; i < matches.length; i++) {

            const match = matches[i];

            const practicalNumber = match[1];

            const aimStart = match.index + match[0].length;

            const nextStart =
                i + 1 < matches.length
                    ? matches[i + 1].index
                    : text.length;

            let section = text.substring(aimStart, nextStart);

            section = section.trim();


            /*
                The first part of the section is the aim.

                We keep the first line as the Aim and
                everything after it as the practical code/text.
            */

            const lines = section.split(/\r?\n/);

            let aim = "";

            let code = "";


            // Find first non-empty line
            let firstLineIndex = -1;

            for (let j = 0; j < lines.length; j++) {

                if (lines[j].trim() !== "") {
                    firstLineIndex = j;
                    break;
                }
            }


            if (firstLineIndex !== -1) {

                aim = lines[firstLineIndex].trim();

                code = lines
                    .slice(firstLineIndex + 1)
                    .join("\n")
                    .trim();

            }


            practicals.push({
                number: practicalNumber,
                aim: aim,
                code: code
            });
        }

        return practicals;
    }


    // --------------------------------------------------
    // Create category
    // --------------------------------------------------

    function createCategory(category, practicals) {

        const categoryDiv = document.createElement("div");

        categoryDiv.className = "category";


        // Category title

        const title = document.createElement("div");

        title.className = "category-title";

        title.innerHTML =
            '<span class="arrow">▶</span>' +
            category.name +
            ' Practicals';


        title.onclick = function () {

            categoryDiv.classList.toggle("open");

        };


        categoryDiv.appendChild(title);


        // Practicals container

        const practicalsDiv = document.createElement("div");

        practicalsDiv.className = "practicals";


        // Create each practical

        practicals.forEach(function (practical) {

            const practicalDiv =
                document.createElement("div");

            practicalDiv.className = "practical";


            // Practical title

            const practicalTitle =
                document.createElement("div");

            practicalTitle.className =
                "practical-title";

            practicalTitle.innerHTML =
                '<span class="arrow">▶</span>' +
                practical.number +
                " - " +
                escapeHtml(practical.aim);


            practicalTitle.onclick = function () {

                practicalDiv.classList.toggle("open");

            };


            // Practical content

            const content =
                document.createElement("div");

            content.className =
                "practical-content";


            // Aim

            const aim =
                document.createElement("div");

            aim.className = "aim";

            aim.innerHTML =
                "Aim: " +
                escapeHtml(practical.aim);


            content.appendChild(aim);


            // Code

            if (practical.code) {

                const pre =
                    document.createElement("pre");

                pre.textContent = practical.code;

                content.appendChild(pre);

            }


            practicalDiv.appendChild(practicalTitle);

            practicalDiv.appendChild(content);

            practicalsDiv.appendChild(practicalDiv);

        });


        categoryDiv.appendChild(practicalsDiv);

        return categoryDiv;
    }


    // --------------------------------------------------
    // Prevent HTML inside practical files from
    // being interpreted as webpage code
    // --------------------------------------------------

    function escapeHtml(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // --------------------------------------------------
    // Load everything
    // --------------------------------------------------

    async function loadViewer() {

        const viewer =
            document.getElementById("viewer");

        const loading =
            document.getElementById("loading");


        try {

            loading.style.display = "block";

            for (const category of categories) {

                const text =
                    await loadFile(category.file);

                const practicals =
                    parsePracticals(text);


                if (practicals.length === 0) {

                    console.warn(
                        "No practicals found in " +
                        category.file
                    );

                    continue;
                }


                const categoryElement =
                    createCategory(
                        category,
                        practicals
                    );


                viewer.appendChild(
                    categoryElement
                );
            }


            loading.style.display = "none";


            if (viewer.children.length === 0) {

                viewer.innerHTML =
                    '<div class="error">' +
                    '<strong>No practicals found.</strong><br><br>' +
                    'Please check the MAJOR, ETHICAL and STQA files.' +
                    '</div>';

            }

        }
        catch (error) {

            loading.style.display = "none";

            console.error(error);

            viewer.innerHTML =
                '<div class="error">' +
                '<strong>Error loading practical files.</strong><br><br>' +
                escapeHtml(error.message) +
                '<br><br>' +
                'Make sure the files MAJOR, ETHICAL and STQA exist in the root of the repository.' +
                '</div>';

        }

    }


    // Start the viewer

    loadViewer();

</script>

</body>
</html>
