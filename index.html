<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Practical Files Viewer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 42px;
            margin: 0;
        }

        .subject {
            margin: 10px 30px;
        }

        .subject-title {
            background: white;
            padding: 18px;
            border-radius: 10px;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .subject-title:hover {
            background: #eeeeee;
        }

        .arrow {
            display: inline-block;
            width: 25px;
        }

        .practicals {
            display: none;
            margin-top: 8px;
        }

        .practical {
            background: white;
            margin: 8px 0;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;

            box-shadow: 0 1px 5px rgba(0,0,0,0.10);
        }

        .practical:hover {
            background: #eeeeee;
        }

        .code {
            display: none;
            background: #222;
            color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 7px;

            white-space: pre-wrap;
            overflow-x: auto;

            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
        }

        .loading {
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }

        .error {
            background: #ffe5e5;
            color: #b00000;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
        }

    </style>

</head>


<body>


<header>

    <h1>📁 Practical Files Viewer</h1>

</header>


<div id="subjects"></div>


<script>


const subjects = [

    {
        name: "MAJOR Practicals",
        file: "MAJOR"
    },

    {
        name: "ETHICAL Practicals",
        file: "ETHICAL"
    },

    {
        name: "STQA Practicals",
        file: "STQA"
    }

];


const container =
    document.getElementById("subjects");



async function loadFile(subject, practicalContainer) {

    practicalContainer.innerHTML =
        '<div class="loading">Loading practicals...</div>';

    try {

        const response =
            await fetch("./" + subject.file);

        if (!response.ok) {
            throw new Error("File not found");
        }

        const text =
            await response.text();


        displayPracticals(
            text,
            practicalContainer
        );


    } catch (error) {

        practicalContainer.innerHTML = `
            <div class="error">
                Unable to load ${subject.file}.
                <br><br>
                Make sure the file is named exactly:
                <strong>${subject.file}</strong>
            </div>
        `;

    }

}



function displayPracticals(text, container) {


    /*
       Your MAJOR file contains practicals
       starting with things such as:

       P1.Aim:
       P2.Aim:
       P3.Aim:

       This code detects those automatically.
    */


    const pattern =
        /(?=P\d+\s*\.?\s*Aim\s*:)/gi;


    let parts =
        text.split(pattern);


    parts =
        parts.filter(
            part => part.trim().length > 0
        );


    /*
       If practical headings were found,
       display each practical separately.
    */

    if (parts.length > 1) {

        container.innerHTML = "";

        parts.forEach((part, index) => {

            const practical =
                document.createElement("div");

            practical.className =
                "practical";


            /*
               Get the practical number
            */

            const match =
                part.match(
                    /P(\d+)\s*\.?\s*Aim/i
                );


            let number =
                match ? match[1] : index + 1;


            practical.textContent =
                "Practical No. " + number;


            const code =
                document.createElement("div");

            code.className = "code";


            code.textContent =
                part.trim();


            practical.onclick = function () {

                if (
                    code.style.display === "block"
                ) {

                    code.style.display = "none";

                } else {

                    code.style.display = "block";

                }

            };


            container.appendChild(practical);

            container.appendChild(code);

        });


    }

    /*
       If the file doesn't contain P1.Aim,
       P2.Aim etc., simply show the
       entire file.
    */

    else {

        container.innerHTML = "";

        const practical =
            document.createElement("div");

        practical.className =
            "practical";

        practical.textContent =
            "View Practical File";


        const code =
            document.createElement("div");

        code.className = "code";

        code.style.display = "block";

        code.textContent =
            text;


        practical.onclick = function () {

            if (
                code.style.display === "block"
            ) {

                code.style.display = "none";

            } else {

                code.style.display = "block";

            }

        };


        container.appendChild(practical);

        container.appendChild(code);

    }

}



subjects.forEach(subject => {


    const subjectDiv =
        document.createElement("div");

    subjectDiv.className =
        "subject";


    const title =
        document.createElement("div");

    title.className =
        "subject-title";


    title.innerHTML = `
        <span class="arrow">▶</span>
        ${subject.name}
    `;


    const practicalContainer =
        document.createElement("div");

    practicalContainer.className =
        "practicals";


    title.onclick = function () {


        if (
            practicalContainer.style.display ===
            "block"
        ) {

            practicalContainer.style.display =
                "none";

            title.querySelector(".arrow")
                .textContent = "▶";

        }

        else {

            practicalContainer.style.display =
                "block";

            title.querySelector(".arrow")
                .textContent = "▼";


            /*
               Load the file only when
               the user opens the subject.
            */

            if (
                practicalContainer.dataset.loaded
                !== "true"
            ) {

                loadFile(
                    subject,
                    practicalContainer
                );

                practicalContainer.dataset.loaded =
                    "true";

            }

        }

    };


    subjectDiv.appendChild(title);

    subjectDiv.appendChild(
        practicalContainer
    );

    container.appendChild(subjectDiv);

});


</script>


</body>

</html>
